# Render Blueprint for the backend (native Python runtime, no Docker).
# Render dashboard > New > Blueprint > pick this repository. See DEPLOY.md.
services:
  - type: web
    name: fiberguard-api
    runtime: python
    plan: free
    region: singapore
    # run from the repository root: backend/requirements.txt installs CPU-only PyTorch and the shared ml/ package
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FIBER_TORCH_THREADS
        value: "1"
      # the Vercel URL of the frontend, e.g. https://fiberguard.vercel.app (comma-separate several)
      - key: FIBER_CORS_ORIGINS
        sync: false
